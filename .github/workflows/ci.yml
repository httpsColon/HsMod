name: Auto Build Test

on:
  push:
    branches: [ "bepinex5" ]
  pull_request:
  merge_group:

jobs:
  build:
    runs-on: windows-latest

    steps:
    # Checkout the repository
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    # Setup .NET SDK
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.x
    
    # Restore dependencies
    - name: Restore dependencies
      run: dotnet restore --locked-mode
    
    # Build the project
    - name: Build HsMod
      run: dotnet build --configuration Release --no-restore

    # 5. 查找 HsMod.dll 文件
    - name: Find HsMod.dll
      id: find_dll
      run: |
          $dllPath = Get-ChildItem -Path . -Recurse -Filter "HsMod.dll" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if ($dllPath) {
            Write-Host "Found HsMod.dll at: $dllPath"
            # 将找到的路径设置为输出变量，供下一步使用
            echo "dll_path=$dllPath" >> $env:GITHUB_OUTPUT
          } else {
            Write-Error "HsMod.dll not found!"
            exit 1
          }
        shell: pwsh

    # 6. 上传构建产物
    - name: Upload HsMod.dll
      uses: actions/upload-artifact@v4
      with:
          name: HsMod-Plugin
          path: ${{ steps.find_dll.outputs.dll_path }}
